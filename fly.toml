# Configuration Fly.io pour Xamsa Media.
# 1) Changez "app" pour un nom GLOBALEMENT unique (ex. "xamsamedia-sn").
# 2) Le volume "xamsa_data" garde la base SQLite + les medias (persistant).
app = "xamsamedia"
primary_region = "cdg"          # Paris : bonne latence vers le Senegal

[build]

[env]
  DJANGO_DEBUG = "0"
  # Remplacez par votre domaine .fly.dev puis ajoutez votre domaine perso.
  DJANGO_ALLOWED_HOSTS = "xamsamedia.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://xamsamedia.fly.dev"
  # Base + medias sur le volume monte en /data (persistant).
  DJANGO_DB_PATH = "/data/db.sqlite3"
  DJANGO_MEDIA_ROOT = "/data/media"

[[mounts]]
  source = "xamsa_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # IMPORTANT : garder la machine allumee pour l'ingestion RSS + le brief du jour.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
