<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3B74C9"/><stop offset="0.5" stop-color="#245BB0"/><stop offset="1" stop-color="#14305F"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.16" r="0.34">
