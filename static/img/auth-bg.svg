    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3D74"/><stop offset="1" stop-color="#0E2247"/>
    </linearGradient>
    <pattern id="dots" width="52" height="52" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity="0.07"/></pattern>
  </defs>

  <rect width="1200" height="1500" fill="url(#sky)"/>
